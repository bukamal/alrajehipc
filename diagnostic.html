<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تشخيص الراجحي</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #f0f4f8; }
        .card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .pass { color: green; font-weight: bold; }
        .fail { color: red; font-weight: bold; }
        .info { color: blue; }
        pre { background: #f4f4f4; padding: 10px; border-radius: 8px; overflow-x: auto; }
        button { background: #4f46e5; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔍 فحص نظام الراجحي (للهاتف)</h2>
        <div id="results">جاري الفحص...</div>
        <button id="retest">إعادة الفحص</button>
    </div>
    <script>
        const resultsDiv = document.getElementById('results');
        function log(msg, type = 'info') {
            const color = type === 'pass' ? 'green' : (type === 'fail' ? 'red' : 'blue');
            resultsDiv.innerHTML += `<div style="color:${color}; margin-top:8px;">${msg}</div>`;
            console.log(msg);
        }
        
        async function checkFile(url) {
            try {
                const res = await fetch(url, { method: 'HEAD' });
                if (res.ok) return true;
                throw new Error(`HTTP ${res.status}`);
            } catch(e) {
                log(`❌ ملف ${url} غير موجود: ${e.message}`, 'fail');
                return false;
            }
        }
        
        async function runTests() {
            resultsDiv.innerHTML = '🧪 بدء الفحص...<br>';
            
            // 1. فحص وجود ملفات lib
            log('📁 فحص مجلد lib:', 'info');
            const libFiles = [
                'lib/sql-wasm.js',
                'lib/sql-wasm.wasm'
            ];
            let allLibsOk = true;
            for (const file of libFiles) {
                const ok = await checkFile(file);
                if (!ok) allLibsOk = false;
            }
            if (allLibsOk) log('✅ جميع ملفات lib موجودة', 'pass');
            else log('⚠️ بعض ملفات lib مفقودة', 'fail');
            
            // 2. فتح IndexedDB
            log('💾 فحص IndexedDB...', 'info');
            try {
                const req = indexedDB.open('AlrajhiSQLiteStorage', 1);
                const db = await new Promise((resolve, reject) => {
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
                db.close();
                log('✅ IndexedDB يعمل', 'pass');
            } catch(e) {
                log(`❌ IndexedDB فشل: ${e.message}`, 'fail');
            }
            
            // 3. تحميل SQL.js واختبار إنشاء جدول
            log('🗄️ تحميل SQL.js...', 'info');
            try {
                const initSqlJs = await import('./lib/sql-wasm.js');
                const SQL = await initSqlJs.default({ locateFile: () => './lib/sql-wasm.wasm' });
                log('✅ تم تحميل SQL.js', 'pass');
                
                const db = new SQL.Database();
                db.run("CREATE TABLE test (id int, name text)");
                db.run("INSERT INTO test VALUES (1, 'الراجحي')");
                const stmt = db.prepare("SELECT * FROM test");
                stmt.step();
                const row = stmt.getAsObject();
                stmt.free();
                if (row.id === 1 && row.name === 'الراجحي') {
                    log('✅ SQLite يعمل بشكل صحيح (قراءة وكتابة)', 'pass');
                } else {
                    log('❌ بيانات غير متوقعة من SQLite', 'fail');
                }
                db.close();
            } catch(e) {
                log(`❌ فشل SQL.js: ${e.message}`, 'fail');
                console.error(e);
            }
            
            log('🏁 انتهى الفحص. إذا ظهرت أي أخطاء، أصلحها.', 'pass');
        }
        
        document.getElementById('retest').onclick = () => runTests();
        runTests();
    </script>
</body>
</html>
